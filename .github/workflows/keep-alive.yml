name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at noon UTC — well under Supabase's 7-day pause threshold
    - cron: "0 12 */3 * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are configured
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing. Add them in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Secrets are present."

      - name: Query a real table to register DB activity
        run: |
          curl --fail --silent --show-error \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --output /tmp/response.json \
            --write-out "HTTP Status: %{http_code}\n"
          echo "Response body:"
          cat /tmp/response.json

      - name: Confirm success
        run: echo "✅ Supabase pinged successfully — project activity registered."
